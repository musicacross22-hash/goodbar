<style>
/* Layout: black stage like the Goodbar menu; cover shows the outlined headline + Instagram-style info card; two big buttons (gold / white); inside, sticky chips + price rows with drink thumbnails. */
:root {
  --bg: #0a0a0a;
  --surface: #161616;
  --line: #2c2c2c;
  --fg: #ffffff;
  --muted: #b9b3a6;
  --gold: #f4a81d;
  --card: #ffffff;
  --card-fg: #111111;
  --accent: var(--gold);
  --display: "Archivo Black", "Arial Black", Impact, system-ui, sans-serif;
  --body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 30;
}
.wrap {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.out { color: transparent; -webkit-text-stroke: 1.6px var(--fg); }
@supports not (-webkit-text-stroke: 1px #fff) { .out { color: var(--fg); } }

/* ---------- Home ---------- */
.home { position: relative; overflow: hidden; padding-block: 36px 56px; }
.sun {
  position: absolute;
  left: 50%;
  top: 170px;
  width: 960px;
  max-width: none;
  height: 960px;
  margin-left: -480px;
  margin-top: -480px;
  opacity: 0.07;
  pointer-events: none;
  animation: spin 180s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hero { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding-bottom: 28px; }
.logo { width: 120px; height: 120px; display: block; }
.cover { font-family: var(--display); text-transform: uppercase; font-weight: 400; line-height: 0.98; font-size: clamp(2.5rem, 13vw, 4.2rem); letter-spacing: -0.01em; display: flex; flex-direction: column; }
.info { background: var(--card); color: var(--card-fg); border-radius: 18px; padding: 16px 18px; text-align: left; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
.info .who { display: flex; align-items: center; gap: 12px; }
.info .who svg { width: 40px; height: 40px; flex: 0 0 auto; }
.info .who b { display: block; line-height: 1.2; }
.info .who a { color: #555; font-size: 0.9rem; text-decoration: none; }
.info .row { font-size: 0.88rem; line-height: 1.4; color: #222; }
.info .row small { display: block; color: #555; font-size: inherit; }
.choices { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.choice {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 28px;
  min-height: 220px;
  padding: 22px 20px;
  border-radius: 14px;
  text-decoration: none;
  color: #0a0a0a;
  transition: transform 0.15s ease;
}
.choice:hover { transform: translateY(-3px); }
.choice.comida { background: var(--gold); }
.choice.bebestibles { background: #ffffff; }
.choice b { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(1.3rem, 5.4vw, 1.8rem); line-height: 1.05; overflow-wrap: anywhere; }
.choice span { font-size: 0.92rem; font-weight: 500; line-height: 1.35; }
.choice i { font-style: normal; font-family: var(--display); font-size: 1.5rem; }
.foot { position: relative; margin-top: 32px; text-align: center; color: var(--muted); font-size: 0.85rem; }

/* ---------- Menu views ---------- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; }
.back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.9rem; padding: 6px 0; }
.back:hover { color: var(--fg); }
.view-title { font-family: var(--display); text-transform: uppercase; font-size: 1rem; color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--fg);
  font: 600 0.88rem var(--body);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0a0a0a; }

.menu { padding-block: 28px 64px; display: flex; flex-direction: column; gap: 48px; }
.cat { display: flex; flex-direction: column; gap: 22px; scroll-margin-top: 130px; }
.cat > h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(1.7rem, 8vw, 2.4rem); line-height: 1; letter-spacing: 0.01em; padding-bottom: 12px; border-bottom: 3px solid var(--accent); overflow-wrap: anywhere; }
.cat-note { color: var(--muted); font-size: 0.9rem; margin-top: -12px; }
.group { display: flex; flex-direction: column; }
.group > h3 { font-family: var(--display); font-weight: 400; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
.group > .gnote { color: var(--muted); font-size: 0.86rem; margin-top: 2px; }
.items { margin-top: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.item:last-child { border-bottom: 0; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.price { font-family: var(--display); font-size: 0.95rem; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; grid-column: 2; grid-row: 1; align-self: start; }
.desc { grid-column: 1; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
.item.has-thumb { grid-template-columns: 54px minmax(0, 1fr) auto; align-items: center; gap: 2px 14px; }
.item.has-thumb .price { grid-column: auto; grid-row: auto; align-self: center; }
.price.na { font-family: var(--body); font-weight: 500; font-size: 0.8rem; color: var(--muted); }
.thumb { width: 54px; height: 54px; background: var(--surface); border-radius: 12px; padding: 5px; display: block; }
.info-col { display: flex; flex-direction: column; min-width: 0; }
.mfoot { padding-block: 0 48px; color: var(--muted); font-size: 0.85rem; text-align: center; }

@media (max-width: 520px) {
  .choices { grid-template-columns: 1fr; }
  .choice { min-height: 170px; }
}
@media (prefers-reduced-motion: reduce) {
  .sun { animation: none; }
  .choice { transition: none; }
}
</style>

          '</div>' +
        '</header>' +
        '<nav class="choices" aria-label="Carta">' +
          '<a class="choice comida" href="#comida"><b>Comida</b><span>Apetizzer, hamburguesas, papas horneadas y pizzas.</span><i aria-hidden="true">→</i></a>' +
          '<a class="choice bebestibles" href="#bebestibles"><b>Bebestibles</b><span>Cervezas, mojitos, cocteles, destilados y más.</span><i aria-hidden="true">→</i></a>' +
        '</nav>' +
        '<p class="foot">Valores en pesos chilenos.</p>' +
      '</div></main>';
  }

  function itemHtml(it, gi) {
    var hasPrice = typeof it.p === "number";
    var priceHtml = hasPrice ? '<span class="price">' + money(it.p) + '</span>' : '<span class="price na">Consultar</span>';
    if (thumbs) {
      return '<div class="item has-thumb">' + icon(it.i || gi) + '<div class="info-col"><span class="name">' + esc(it.n) + '</span>' + (it.d ? '<span class="desc">' + esc(it.d) + '</span>' : "") + '</div>' + priceHtml + '</div>';
    }
    return '<div class="item"><span class="name">' + esc(it.n) + '</span>' + priceHtml + (it.d ? '<span class="desc">' + esc(it.d) + '</span>' : "") + '</div>';
  }

  function groupHtml(g) {
    var head = (g.name ? '<h3>' + esc(g.name) + '</h3>' : "") + (g.note ? '<p class="gnote">' + esc(g.note) + '</p>' : "");
    return '<div class="group">' + head + '<div class="items">' + g.items.map(function (it) { return itemHtml(it, g.i); }).join("") + '</div></div>';
  }

  function catHtml(c) {
    return '<section class="cat" id="cat-' + c.id + '"><h2>' + esc(c.title) + '</h2>' +
      (c.note ? '<p class="cat-note">' + esc(c.note) + '</p>' : "") +
      c.groups.map(groupHtml).join("") + '</section>';
  }

  function view(key) {
    var v = DATA[key];
    thumbs = key === "bebestibles";
    var chips = '<button class="chip" type="button" data-cat="todo" aria-pressed="' + (active === "todo") + '">Todo</button>' +
      v.cats.map(function (c) { return '<button class="chip" type="button" data-cat="' + c.id + '" aria-pressed="' + (active === c.id) + '">' + esc(c.title) + '</button>'; }).join("");
    var shown = v.cats.filter(function (c) { return active === "todo" || active === c.id; });
    return '<div>' +
      '<header class="bar"><div class="wrap">' +
        '<div class="bar-top"><a class="back" href="#">← Inicio</a><span class="view-title">' + esc(v.title) + '</span></div>' +
        '<div class="chips" role="group" aria-label="Categorías">' + chips + '</div>' +
      '</div></header>' +
      '<main class="wrap menu">' + shown.map(catHtml).join("") + '</main>' +
      '<p class="wrap mfoot">GoodBar · Avenida Chacabuco 1266, Concepción · Valores en pesos chilenos.</p></div>';
  }

  function render() {
    var route = location.hash.replace("#", "");
    if (route !== lastRoute) { active = "todo"; lastRoute = route; window.scrollTo(0, 0); }
    app.innerHTML = DATA[route] ? view(route) : home();
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".chip") : null;
    if (!b) return;
    active = b.getAttribute("data-cat");
    render();
    window.scrollTo(0, 0);
  });
  window.addEventListener("hashchange", render);
  render();
})();
</script>

</body></html>
